<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin | FlipFinder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #111;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>FlipFinder</h1>

    <div class="subtitle">
      Panel de administración
    </div>

    <form id="loginForm">

      <label for="email">
        Correo electrónico
      </label>

      <input
        type="email"
        id="email"
        placeholder="admin@ejemplo.com"
        required
      >

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="••••••••"
        required
      >

      <button type="submit" id="loginButton">
        Iniciar sesión
      </button>

    </form>

    <div id="mensaje"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const mensaje = document.getElementById("mensaje");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      mensaje.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "Ingresando...";

      try {
        const { data, error } =
          await window.supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error("No se pudo obtener el usuario.");
        }

        const { data: admin, error: adminError } =
          await window.supabaseClient
            .from("admins")
            .select("user_id")
            .eq("user_id", data.user.id)
            .maybeSingle();

        if (adminError) {
          throw adminError;
        }

        if (!admin) {
          await window.supabaseClient.auth.signOut();

          throw new Error(
            "Este usuario no tiene permisos de administrador."
          );
        }

        window.location.href = "admin.html";

      } catch (error) {

        console.error(error);

        mensaje.textContent =
          error.message ||
          "No se pudo iniciar sesión.";

        mensaje.style.color = "red";

        loginButton.disabled = false;
        loginButton.textContent = "Iniciar sesión";
      }
    });
  </script>

</body>
</html>
