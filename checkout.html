<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | FlipFinder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 27px;
      font-weight: 800;
    }

    .volver {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .contenedor {
      width: 92%;
      max-width: 1150px;
      margin: 35px auto 70px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 28px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 25px;
      align-items: start;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
    }

    .card h2 {
      font-size: 21px;
      margin-bottom: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .campo.completo {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      height: 46px;
      border: 1px solid #d7d9dd;
      border-radius: 9px;
      padding: 0 13px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #111;
    }

    .producto {
      display: flex;
      gap: 15px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e5e5e5;
    }

    .producto img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 10px;
      background: #f5f5f5;
    }

    .producto-info {
      flex: 1;
    }

    .producto-info h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .precio {
      font-size: 18px;
      font-weight: 700;
    }

    .cantidad-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .cantidad-box button {
      width: 32px;
      height: 32px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 7px;
      font-size: 19px;
      cursor: pointer;
    }

    .cantidad-box span {
      min-width: 25px;
      text-align: center;
      font-weight: 700;
    }

    .resumen {
      margin-top: 22px;
    }

    .fila {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 15px;
    }

    .fila.total {
      border-top: 1px solid #ddd;
      padding-top: 18px;
      margin-top: 18px;
      font-size: 22px;
      font-weight: 800;
    }

    .boton-pago {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 22px;
      transition: 0.2s;
    }

    .boton-pago:hover {
      background: #12813b;
    }

    .boton-pago:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .mensaje {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.4;
    }

    .mensaje.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .mensaje.info {
      display: block;
      background: #e0f2fe;
      color: #075985;
    }

    .seguridad {
      margin-top: 16px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .campo.completo {
        grid-column: auto;
      }

      header {
        padding: 0 5%;
      }

      .contenedor {
        width: 94%;
        margin-top: 25px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">FlipFinder</a>

    <a href="index.html" class="volver">
      ← Volver a la tienda
    </a>
  </header>


  <main class="contenedor">

    <h1>Finalizar compra</h1>

    <div class="checkout-grid">

      <!-- ============================= -->
      <!-- DATOS DE ENVÍO -->
      <!-- ============================= -->

      <section class="card">

        <h2>Datos de envío</h2>

        <form id="checkoutForm">

          <div class="form-grid">

            <div class="campo">
              <label for="nombre">Nombre</label>

              <input
                type="text"
                id="nombre"
                placeholder="Tu nombre"
                required
              >
            </div>


            <div class="campo">
              <label for="apellido">Apellido</label>

              <input
                type="text"
                id="apellido"
                placeholder="Tu apellido"
                required
              >
            </div>


            <div class="campo">
              <label for="email">Correo electrónico</label>

              <input
                type="email"
                id="email"
                placeholder="tucorreo@email.com"
                required
              >
            </div>


            <div class="campo">
              <label for="telefono">Teléfono</label>

              <input
                type="tel"
                id="telefono"
                placeholder="+56 9 1234 5678"
                required
              >
            </div>


            <div class="campo completo">
              <label for="direccion">Dirección</label>

              <input
                type="text"
                id="direccion"
                placeholder="Calle, número, departamento..."
                required
              >
            </div>


            <div class="campo">
              <label for="comuna">Comuna</label>

              <input
                type="text"
                id="comuna"
                placeholder="Ej: Santiago"
                required
              >
            </div>


            <div class="campo">
              <label for="region">Región</label>

              <select id="region" required>

                <option value="">
                  Selecciona una región
                </option>

                <option>Arica y Parinacota</option>
                <option>Tarapacá</option>
                <option>Antofagasta</option>
                <option>Atacama</option>
                <option>Coquimbo</option>
                <option>Valparaíso</option>
                <option>Metropolitana de Santiago</option>
                <option>O'Higgins</option>
                <option>Maule</option>
                <option>Ñuble</option>
                <option>Biobío</option>
                <option>La Araucanía</option>
                <option>Los Ríos</option>
                <option>Los Lagos</option>
                <option>Aysén</option>
                <option>Magallanes</option>

              </select>
            </div>


            <div class="campo completo">

              <label for="referencia">
                Referencia de entrega
              </label>

              <input
                type="text"
                id="referencia"
                placeholder="Ej: casa azul, portón negro..."
              >

            </div>

          </div>

        </form>

      </section>


      <!-- ============================= -->
      <!-- RESUMEN -->
      <!-- ============================= -->

      <section class="card">

        <h2>Resumen de tu pedido</h2>


        <div class="producto">

          <img
            src="img/auriculares-gamer.jpg"
            alt="Auriculares Gamer"
            onerror="this.style.display='none'"
          >


          <div class="producto-info">

            <h3>
              Auriculares Gamer con Micrófono
            </h3>


            <div class="precio">
              $23.400
            </div>


            <div class="cantidad-box">

              <button
                type="button"
                onclick="cambiarCantidad(-1)"
              >
                −
              </button>


              <span id="cantidad">
                1
              </span>


              <button
                type="button"
                onclick="cambiarCantidad(1)"
              >
                +
              </button>

            </div>

          </div>

        </div>


        <div class="resumen">

          <div class="fila">

            <span>
              Subtotal
            </span>

            <span id="subtotal">
              $23.400
            </span>

          </div>


          <div class="fila">

            <span>
              Envío
            </span>

            <span>
              Gratis
            </span>

          </div>


          <div class="fila total">

            <span>
              Total
            </span>

            <span id="total">
              $23.400
            </span>

          </div>

        </div>


        <button
          type="button"
          class="boton-pago"
          id="botonPago"
          onclick="continuarConPago()"
        >
          Continuar con el pago
        </button>


        <div
          id="mensaje"
          class="mensaje"
        ></div>


        <div class="seguridad">
          🔒 Serás redirigido a Mercado Pago para realizar el pago de forma segura.
        </div>

      </section>

    </div>

  </main>


  <!-- ================================= -->
  <!-- SUPABASE -->
  <!-- ================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./supabase-config.js"></script>


  <script>

    // ==========================================
    // PRODUCTO
    // ==========================================

    const PRECIO = 23400;

    let cantidad = 1;


    // ==========================================
    // LEER CANTIDAD DE LA URL
    // ==========================================

    const parametros =
      new URLSearchParams(window.location.search);

    const cantidadURL =
      Number(parametros.get("cantidad"));


    if (
      Number.isInteger(cantidadURL) &&
      cantidadURL >= 1 &&
      cantidadURL <= 20
    ) {
      cantidad = cantidadURL;
    }


    // ==========================================
    // FORMATO CLP
    // ==========================================

    function formatoCLP(numero) {

      return new Intl.NumberFormat("es-CL", {
        style: "currency",
        currency: "CLP",
        maximumFractionDigits: 0
      }).format(numero);

    }


    // ==========================================
    // ACTUALIZAR RESUMEN
    // ==========================================

    function actualizarResumen() {

      const subtotal =
        PRECIO * cantidad;


      document.getElementById("cantidad")
        .textContent = cantidad;


      document.getElementById("subtotal")
        .textContent = formatoCLP(subtotal);


      document.getElementById("total")
        .textContent = formatoCLP(subtotal);

    }


    // ==========================================
    // CAMBIAR CANTIDAD
    // ==========================================

    function cambiarCantidad(valor) {

      cantidad += valor;


      if (cantidad < 1) {
        cantidad = 1;
      }


      if (cantidad > 20) {
        cantidad = 20;
      }


      localStorage.setItem(
        "flipfinder_carrito_cantidad",
        cantidad
      );


      actualizarResumen();

    }


    // ==========================================
    // MENSAJES
    // ==========================================

    function mostrarMensaje(texto, tipo) {

      const mensaje =
        document.getElementById("mensaje");


      mensaje.textContent = texto;


      mensaje.className =
        "mensaje " + tipo;

    }


    function ocultarMensaje() {

      const mensaje =
        document.getElementById("mensaje");


      mensaje.textContent = "";

      mensaje.className =
        "mensaje";

    }


    // ==========================================
    // CONTINUAR CON EL PAGO
    // ==========================================

    async function continuarConPago() {

      ocultarMensaje();


      const formulario =
        document.getElementById("checkoutForm");


      // Validar formulario
      if (!formulario.checkValidity()) {

        formulario.reportValidity();

        return;
      }


      // ==========================================
      // DATOS DEL CLIENTE
      // ==========================================

      const nombre =
        document.getElementById("nombre")
          .value.trim();


      const apellido =
        document.getElementById("apellido")
          .value.trim();


      const email =
        document.getElementById("email")
          .value.trim();


      const telefono =
        document.getElementById("telefono")
          .value.trim();


      const direccion =
        document.getElementById("direccion")
          .value.trim();


      const comuna =
        document.getElementById("comuna")
          .value.trim();


      const region =
        document.getElementById("region")
          .value.trim();


      const referencia =
        document.getElementById("referencia")
          .value.trim();


      // ==========================================
      // GUARDAR PEDIDO LOCALMENTE
      // ==========================================

      const pedido = {

        producto:
          "Auriculares Gamer con Micrófono",

        precio:
          PRECIO,

        cantidad:
          cantidad,

        total:
          PRECIO * cantidad,

        cliente: {

          nombre:
            nombre,

          apellido:
            apellido,

          email:
            email,

          telefono:
            telefono,

          direccion:
            direccion,

          comuna:
            comuna,

          region:
            region,

          referencia:
            referencia

        },

        fecha:
          new Date().toISOString()

      };


      localStorage.setItem(
        "flipfinder_pedido",
        JSON.stringify(pedido)
      );


      // ==========================================
      // BOTÓN
      // ==========================================

      const boton =
        document.getElementById("botonPago");


      boton.disabled = true;

      boton.textContent =
        "Preparando pago...";


      mostrarMensaje(
        "Conectando con Mercado Pago...",
        "info"
      );


      try {

        // ========================================
        // VERIFICAR SUPABASE
        // ========================================

        /*
          Tu supabase-config.js crea:

          window.supabaseClient

          Por eso usamos exactamente
          window.supabaseClient aquí.
        */

        if (
          !window.supabaseClient ||
          !window.supabaseClient.functions
        ) {

          throw new Error(
            "No se encontró la configuración de Supabase."
          );

        }


        // ========================================
        // LLAMAR EDGE FUNCTION
        // ========================================

        const resultado =
          await window.supabaseClient.functions.invoke(
            "crear-pago",
            {

              body: {

                cantidad:
                  cantidad,

                email:
                  email,

                nombre:
                  nombre,

                apellido:
                  apellido

              }

            }
          );


        const data =
          resultado.data;

        const error =
          resultado.error;


        // ========================================
        // ERROR DE SUPABASE
        // ========================================

        if (error) {

          console.error(
            "Error de Supabase:",
            error
          );


          throw new Error(
            "No se pudo conectar con el servidor de pagos."
          );

        }


        // ========================================
        // ERROR DE LA EDGE FUNCTION
        // ========================================

        if (
          !data ||
          !data.ok
        ) {

          console.error(
            "Respuesta de crear-pago:",
            data
          );


          throw new Error(
            data?.error ||
            "No se pudo crear el pago."
          );

        }


        // ========================================
        // VERIFICAR LINK
        // ========================================

        if (!data.init_point) {

          throw new Error(
            "Mercado Pago no devolvió el enlace de pago."
          );

        }


        // ========================================
        // GUARDAR PREFERENCE ID
        // ========================================

        localStorage.setItem(
          "flipfinder_preference_id",
          data.preference_id || ""
        );


        // ========================================
        // REDIRIGIR A MERCADO PAGO
        // ========================================

        mostrarMensaje(
          "Pago preparado. Redirigiendo a Mercado Pago...",
          "info"
        );


        setTimeout(() => {

          window.location.href =
            data.init_point;

        }, 500);

      }


      catch (error) {

        console.error(
          "Error al crear pago:",
          error
        );


        mostrarMensaje(
          error.message ||
          "Ocurrió un error al preparar el pago.",
          "error"
        );


        boton.disabled = false;

        boton.textContent =
          "Continuar con el pago";

      }

    }


    // ==========================================
    // INICIAR
    // ==========================================

    actualizarResumen();

  </script>

</body>
</html>
