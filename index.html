    <!-- El script de Categorías se coloca al final -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const categoryBtn = document.getElementById('category-btn');
        const categoryDrawer = document.getElementById('category-drawer');

        // Abrir / Cerrar al hacer clic en el botón
        categoryBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          categoryDrawer.classList.toggle('active');
        });

        // Cerrar si se hace clic fuera del menú
        document.addEventListener('click', (e) => {
          if (!categoryDrawer.contains(e.target) && !categoryBtn.contains(e.target)) {
            categoryDrawer.classList.remove('active');
          }
        });
      });
    </script>
  </body>
</html>
