<!-- SDK de Supabase por CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Configuración del cliente Supabase -->
    <script src="supabase-config.js"></script>

    <!-- Script del Carrito de Compras -->
    <script src="cart.js"></script>

    <!-- Script de carga de productos desde Supabase -->
    <script>
        async function cargarProductos() {
            const contenedor = document.getElementById('productos-container') || document.querySelector('.products-grid');
            if (!contenedor) return;

            try {
                const { data: productos, error } = await window.supabase
                    .from('productos')
                    .select('*');

                if (error) throw error;

                if (!productos || productos.length === 0) {
                    contenedor.innerHTML = '<p>No hay productos disponibles.</p>';
                    return;
                }

                contenedor.innerHTML = productos.map(prod => `
                    <div class="product-card">
                        <img src="${prod.imagen || 'img/placeholder.jpg'}" alt="${prod.nombre}">
                        <h3>${prod.nombre}</h3>
                        <p class="price">$${Number(prod.precio).toLocaleString('es-CL')}</p>
                        <button onclick="addToCart('${prod.id}', '${prod.nombre.replace(/'/g, "\\'")}', ${prod.precio}, '${prod.imagen}')">
                            Añadir al carrito
                        </button>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Error al cargar productos:", err);
                contenedor.innerHTML = '<p style="color:red;">Error al cargar productos.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', cargarProductos);
    </script>
</body>
</html>
