<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipFinder Chile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Encabezado / Barra de navegación -->
  <header>
    <div class="logo">
      <h1>FlipFinder</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#catalogo">Catálogo</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Sección principal / Hero -->
  <main>
    <section class="hero">
      <h2>Encuentra los mejores productos al mejor precio</h2>
      <p>Explora nuestro catálogo en línea disponible para Chile.</p>
    </section>

    <!-- Catálogo de Productos -->
    <section id="catalogo" class="catalog-section">
      <h2>Nuestros Productos</h2>
      <div id="productsContainer" class="products-grid">
        <p>Cargando productos...</p>
      </div>
    </section>
  </main>

  <!-- Pie de página -->
  <footer>
    <p>&copy; 2026 FlipFinder Chile - Todos los derechos reservados.</p>
  </footer>

  <!-- ========================================== -->
  <!-- CARGA DE SCRIPTS (Mantener este orden)    -->
  <!-- ========================================== -->
  
  <!-- 1. CDN Oficial de Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Configuración e Inicialización de Supabase -->
  <script src="js/supabase-config.js"></script>

  <!-- 3. Funcionalidades adicionales (Carrito, etc. si existen) -->
  <script src="js/cart.js"></script>

  <!-- 4. Lógica principal (main.js) -->
  <script src="js/main.js"></script>

</body>
</html>
