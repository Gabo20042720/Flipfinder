<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipFinder - Tu Marketplace Principal</title>
  <!-- Enlace al CSS en la carpeta css/ -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR / HEADER -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">FlipFinder</a>
      
      <div class="search-bar-container">
        <button id="catBtn" class="cat-btn">≡ Categorías</button>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar productos...">
      </div>

      <div class="user-actions">
        <a href="pages/admin-login.html" class="nav-link">Mi cuenta</a>
        <button id="cartBtn" class="cart-btn-nav">
          Carrito (<span id="cartCount">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- HERO BANNER -->
  <section class="hero">
    <h1>Compra fácil y seguro.</h1>
    <p>Descubre los mejores productos seleccionados para ti.</p>

    <div class="badges-grid">
      <div class="badge-card">
        <span>🚚</span>
        <div>
          <strong>Envíos a todo Chile</strong>
          <small>Recibe rápido</small>
        </div>
      </div>
      <div class="badge-card">
        <span>🛡️</span>
        <div>
          <strong>Compra segura</strong>
          <small>Protegida</small>
        </div>
      </div>
      <div class="badge-card">
        <span>💳</span>
        <div>
          <strong>Mercado Pago</strong>
          <small>Pagos seguros</small>
        </div>
      </div>
      <div class="badge-card">
        <span>⭐</span>
        <div>
          <strong>Garantía</strong>
          <small>Calidad asegurada</small>
        </div>
      </div>
    </div>
  </section>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-container">
    <!-- BARRA LATERAL DE FILTROS -->
    <aside class="filters-sidebar">
      <h3>Filtros</h3>
      <div class="filter-group">
        <label for="maxPriceInput">Precio Máximo ($)</label>
        <input type="number" id="maxPriceInput" class="filter-input" placeholder="Ej: 30000">
      </div>
      <button id="clearFiltersBtn" class="btn-secondary">Limpiar Filtros</button>
    </aside>

    <!-- GRILLA DE PRODUCTOS -->
    <section>
      <h2 class="section-title">Productos para ti</h2>
      <div id="productsGrid" class="products-grid">
        <!-- Los productos se renderizan dinámicamente con JS -->
      </div>
    </section>
  </main>

  <!-- PANEL LATERAL DEL CARRITO (DRAWER) -->
  <div id="cartDrawer" class="cart-drawer">
    <div class="cart-drawer-header">
      <h3>Tu Carrito</h3>
      <button id="closeCart" class="close-cart-btn">&times;</button>
    </div>
    <div id="cartItems" class="cart-drawer-body">
      <!-- Se llena dinámicamente desde JS -->
    </div>
    <div class="cart-drawer-footer">
      <div class="cart-total-row">
        <span>Total:</span>
        <strong id="cartTotal">$0</strong>
      </div>
      <a href="pages/checkout.html" class="btn-checkout">Proceder al Pago</a>
    </div>
  </div>

  <!-- NOTIFICACIÓN TOAST -->
  <div id="toast" class="toast"></div>

  <!-- ENLACES A JS -->
  <script src="js/supabase-config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
