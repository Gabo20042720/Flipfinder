<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipFinder Chile | Encuentra los mejores productos</title>
  
  <!-- Estilos CSS en orden -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  
  <!-- JavaScript principal -->
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- Barra Superior Estilo Mercado Libre -->
  <header class="main-header">
    <div class="header-content">
      <div class="logo">
        <a href="index.html">Flip<span>Finder</span></a>
      </div>

      <div class="search-box">
        <input type="text" placeholder="Buscar productos, marcas y más...">
        <button type="button">🔍</button>
      </div>

      <div class="header-user-actions">
        <a href="#">Admin</a>
        <a href="pages/cart.html" class="cart-icon">🛒 <span>0</span></a>
      </div>
    </div>

    <nav class="nav-bar">
      <a href="#">Categorías ▾</a>
      <a href="#">Ofertas</a>
      <a href="#">Historial</a>
      <a href="#">Vender</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <!-- Contenido Principal -->
  <main class="main-container">
    <section class="hero-banner">
      <h2>Encuentra los mejores productos al mejor precio</h2>
      <p>Envíos a todo Chile con la rapidez que necesitas.</p>
    </section>

    <section class="catalog-section">
      <h3 class="section-title">Productos Destacados</h3>
      <div id="productos-container">
        <!-- Las tarjetas de producto se insertan aquí vía JS -->
      </div>
    </section>
  </main>

  <!-- Pie de Página -->
  <footer class="main-footer">
    <div class="main-container">
      <p>© 2026 FlipFinder Chile - Todos los derechos reservados.</p>
    </div>
  </footer>

</body>
</html>
