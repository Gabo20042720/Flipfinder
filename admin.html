<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin | FlipFinder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    #cerrarSesion {
      background: white;
      color: #111;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .bienvenida {
      margin-bottom: 25px;
    }

    .bienvenida h2 {
      margin-bottom: 5px;
    }

    .bienvenida p {
      color: #666;
      margin-top: 0;
    }

    .tabla-container {
      background: white;
      border-radius: 14px;
      overflow-x: auto;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #fafafa;
      font-size: 14px;
    }

    td {
      font-size: 14px;
    }

    .estado {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .approved {
      background: #dff7e5;
      color: #18753c;
    }

    .pendiente {
      background: #fff2cc;
      color: #856404;
    }

    .rejected,
    .cancelled {
      background: #f8d7da;
      color: #842029;
    }

    .otro {
      background: #e9ecef;
      color: #495057;
    }

    #mensaje {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .total {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>FlipFinder — Administración</h1>

    <button id="cerrarSesion">
      Cerrar sesión
    </button>
  </header>

  <main>

    <div class="bienvenida">
      <h2>Pedidos</h2>
      <p id="usuarioAdmin">Comprobando sesión...</p>
    </div>

    <div class="tabla-container">

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Email</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Payment ID</th>
          </tr>
        </thead>

        <tbody id="pedidos">
        </tbody>

      </table>

      <div id="mensaje">
        Cargando pedidos...
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <script>
   
    const pedidosElement =
      document.getElementById("pedidos");

    const mensajeElement =
      document.getElementById("mensaje");

    const usuarioAdminElement =
      document.getElementById("usuarioAdmin");

    const cerrarSesionButton =
      document.getElementById("cerrarSesion");


    async function iniciarPanel() {

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        window.location.href = "admin-login.html";
        return;
      }

      const {
        data: admin,
        error: adminError
      } = await supabaseClient
        .from("admins")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

      if (adminError || !admin) {

        await supabaseClient.auth.signOut();

        alert(
          "No tienes permisos de administrador."
        );

        window.location.href = "admin-login.html";
        return;
      }

      usuarioAdminElement.textContent =
        "Sesión iniciada: " + user.email;

      await cargarPedidos();
    }


    async function cargarPedidos() {

      const {
        data: pedidos,
        error
      } = await supabaseClient
        .from("pedidos")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {

        console.error(error);

        mensajeElement.textContent =
          "No se pudieron cargar los pedidos.";

        return;
      }

      mensajeElement.style.display = "none";

      pedidosElement.innerHTML = "";

      if (!pedidos || pedidos.length === 0) {

        mensajeElement.style.display = "block";

        mensajeElement.textContent =
          "Todavía no hay pedidos.";

        return;
      }


      pedidos.forEach(function(pedido) {

        const fila =
          document.createElement("tr");

        const fecha =
          new Date(
            pedido.created_at
          ).toLocaleString("es-CL");


        let claseEstado = "otro";

        if (pedido.estado === "approved") {
          claseEstado = "approved";
        }

        if (pedido.estado === "pendiente") {
          claseEstado = "pendiente";
        }

        if (
          pedido.estado === "rejected" ||
          pedido.estado === "cancelled"
        ) {
          claseEstado = pedido.estado;
        }


        fila.innerHTML = `
          <td>${pedido.id ?? "-"}</td>

          <td>${fecha}</td>

          <td>
            ${(pedido.nombre || "")}
            ${(pedido.apellido || "")}
          </td>

          <td>${pedido.email || "-"}</td>

          <td>${pedido.producto || "-"}</td>

          <td>${pedido.cantidad ?? "-"}</td>

          <td class="total">
            $${Number(
              pedido.total || 0
            ).toLocaleString("es-CL")}
          </td>

          <td>
            <span class="estado ${claseEstado}">
              ${pedido.estado || "-"}
            </span>
          </td>

          <td>${pedido.payment_id || "-"}</td>
        `;

        pedidosElement.appendChild(fila);
      });
    }


    cerrarSesionButton.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
          "admin-login.html";
      }
    );


    iniciarPanel();
  </script>

</body>
</html>
