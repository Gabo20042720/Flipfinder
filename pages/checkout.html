<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipFinder | Mi Carrito</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-bold">Flip</span>Finder
            </a>
            <div class="nav-actions">
                <a href="index.html" class="nav-link">← Seguir comprando</a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content" style="max-width: 800px; margin-top: 2rem;">
        <h2>Tu Carrito de Compras</h2>

        <!-- Estado Vacío -->
        <div id="empty-cart-view" style="display: none; text-align: center; padding: 3rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);">
            <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 1.5rem;">Tu carrito está vacío actualmente.</p>
            <a href="index.html" class="cart-btn">Ir a la tienda</a>
        </div>

        <!-- Contenido del Carrito -->
        <div id="cart-content" style="display: none;">
            <div id="cart-items" style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.5rem;">
                <!-- Se llena dinámicamente con JS -->
            </div>

            <!-- Resumen de Pago -->
            <div style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span style="color: var(--text-muted);">Total a pagar:</span>
                    <h3 id="cart-total" style="font-size: 1.8rem; color: var(--primary);">$0</h3>
                </div>
                <button onclick="alert('¡Gracias por tu compra! Redirigiendo a pasarela de pago...')" class="cart-btn" style="font-size: 1.1rem; padding: 0.8rem 1.5rem; border: none; cursor: pointer;">
                    Pagar con Mercado Pago
                </button>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="cart.js"></script>
</body>
</html>
