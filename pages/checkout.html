<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra - FlipFinder</title>
  
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="../index.html" class="logo">FlipFinder</a>
      <span style="color: #fff; font-weight: 600;">Checkout Seguro 🔒</span>
    </div>
  </header>

  <main class="main-container" style="grid-template-columns: 1fr 380px; margin-top: 2rem;">
    
    <!-- FORMULARIO DE ENVÍO -->
    <section class="checkout-form-section">
      <h2>Datos de Envío</h2>
      <form id="checkoutForm">
        <div class="form-group">
          <label for="fullName">Nombre Completo</label>
          <input type="text" id="fullName" class="filter-input" placeholder="Ej: Gabriel Loyola" required>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" class="filter-input" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Teléfono de Contacto</label>
          <input type="tel" id="phone" class="filter-input" placeholder="+56 9 1234 5678" required>
        </div>

        <div class="form-group">
          <label for="address">Dirección de Entrega</label>
          <input type="text" id="address" class="filter-input" placeholder="Calle, número, departamento" required>
        </div>

        <div class="form-group">
          <label for="city">Comuna / Ciudad</label>
          <input type="text" id="city" class="filter-input" placeholder="Santiago, La Florida, Macul..." required>
        </div>

        <button type="submit" id="btnPay" class="btn-checkout" style="width: 100%; margin-top: 1rem; padding: 1rem; font-size: 1.1rem;">
          Pagar con Mercado Pago
        </button>
      </form>
    </section>

    <!-- RESUMEN DEL PEDIDO -->
    <aside class="filters-sidebar">
      <h3>Resumen del Pedido</h3>
      <div id="checkoutSummary" style="margin-bottom: 1rem;">
        <!-- Se llena desde JS -->
      </div>
      <div style="border-top: 2px solid #E6E6E6; padding-top: 1rem; display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold;">
        <span>Total a pagar:</span>
        <span id="checkoutTotal" style="color: #009EE3;">$0</span>
      </div>
    </aside>

  </main>

  <!-- SCRIPTS -->
  <script src="../js/supabase-config.js"></script>
  <script src="../js/checkout.js"></script>
</body>
</html>
