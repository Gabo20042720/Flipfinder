<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - FlipFinder</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/product-detail.js" defer></script>
</head>
<body>

  <header class="main-header">
    <div class="logo">
      <a href="../index.html">Flip<span>Finder</span></a>
    </div>
  </header>

  <main class="main-container">
    <div class="product-detail-layout">
      
      <!-- Galería con límite de tamaño -->
      <div class="gallery-wrapper">
        <div id="thumbnails-container" class="thumbnails-list">
          <!-- Miniaturas pequeñas aquí -->
        </div>
        <div class="main-image-wrapper">
          <img id="main-product-img" src="" alt="Producto">
        </div>
      </div>

      <!-- Información del Producto -->
      <div class="product-details-info">
        <h1 id="product-title">Cargando producto...</h1>
        <h2 id="product-price" style="font-size: 2rem; color: #1a1a1a;">$0</h2>
        <p id="product-description" style="color: #4a5568; line-height: 1.6;"></p>
        <p id="product-stock" style="font-weight: 600; color: #2d3748;"></p>
        <button class="btn-primary" style="padding: 12px 24px; font-size: 1rem; width: fit-content; margin-top: 10px;">Agregar al carrito</button>
      </div>

    </div>
  </main>

</body>
</html>
