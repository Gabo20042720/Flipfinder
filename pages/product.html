<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - FlipFinder</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/product-detail.js" defer></script>
</head>
<body>

  <header class="main-header">
    <div class="logo">
      <a href="../index.html">Flip<span>Finder</span></a>
    </div>
  </header>

  <main class="main-container">
    <div style="display: flex; gap: 30px; flex-wrap: wrap; margin-top: 20px;">
      
      <!-- Galería -->
      <div style="display: flex; gap: 15px;">
        <div id="thumbnails-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
        <div>
          <img id="main-product-img" src="" alt="Producto" style="max-width: 400px; border-radius: 8px;">
        </div>
      </div>

      <!-- Información -->
      <div style="flex: 1; min-width: 280px;">
        <h1 id="product-title">Cargando...</h1>
        <h2 id="product-price" style="color: #2b2b2b; margin: 15px 0;">$0</h2>
        <p id="product-description" style="color: #666; margin-bottom: 15px;"></p>
        <p id="product-stock" style="font-weight: bold; margin-bottom: 20px;"></p>
        <button class="btn-primary">Agregar al carrito</button>
      </div>

    </div>
  </main>

</body>
</html>
