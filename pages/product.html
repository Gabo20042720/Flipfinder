<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto | FlipFinder Chile</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>

  <div class="ff-top">🚚 <strong>Envío incluido</strong> a todo Chile en cada producto</div>

  <header class="ff-header">
    <div class="ff-header-inner">
      <a href="../index.html" class="ff-logo" aria-label="FlipFinder, ir al inicio">
        <span class="flip">Flip</span><span class="finder">Finder</span>
      </a>
      <form class="ff-search" id="search-form" role="search" action="../index.html">
        <input type="search" id="search-input" name="q" placeholder="Buscar productos, marcas y más..." aria-label="Buscar productos" autocomplete="off">
        <button type="submit" aria-label="Buscar">🔍</button>
      </form>
      <div class="ff-user">
        <a href="../checkout.html" class="ff-cart" aria-label="Ver carrito">🛒 <span id="cart-count">0</span></a>
      </div>
      <nav class="ff-nav" aria-label="Principal">
        <a href="../index.html#productos">Productos</a>
        <a href="../contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="product-detail-layout">

      <!-- Galería -->
      <div class="gallery-box">
        <div id="thumbnails-container" class="thumbnails-list"></div>
        <div class="main-img-box">
          <img id="main-product-img" src="" alt="Producto">
        </div>
      </div>

      <!-- Información -->
      <div class="info-box">
        <h1 id="product-title" class="product-detail-title">Cargando...</h1>
        <h2 id="product-price" class="product-detail-price">$0</h2>
        <p id="product-description" class="product-detail-desc"></p>
        <p id="product-stock" class="product-detail-stock"></p>
        <button class="btn-primary btn-agregar" type="button">Agregar al carrito</button>
      </div>

    </div>
  </main>

  <!-- Orden importante: Supabase → config → carrito → detalle -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/product-detail.js"></script>
  <script src="../js/site.js"></script>
</body>
</html>
