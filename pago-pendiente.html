<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pago pendiente - FlipFinder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    main {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .card {
      background: white;
      max-width: 550px;
      width: 100%;
      padding: 45px 35px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    .boton {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 25px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .boton:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <header>
    <h2>FlipFinder</h2>
    <a href="index.html">← Volver a la tienda</a>
  </header>

  <main>
    <div class="card">

      <div class="icon">⏳</div>

      <h1>Pago pendiente</h1>

      <p>
        Tu pago está siendo procesado.
      </p>

      <p>
        Te avisaremos cuando Mercado Pago confirme el estado de tu pago.
      </p>

      <a class="boton" href="index.html">
        Volver a la tienda
      </a>

    </div>
  </main>

</body>
</html>
